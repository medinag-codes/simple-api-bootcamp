<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Bible API</title>
</head>
<body>
    <h1>The Daily Bread</h1>
    <div>
        <h3>Click to get Verse of the Day</h3>
        <button class="verseButton" type="button" name="verseButton">Get Verse</button>
    </div>
    <div>
        <label for="prayers">Submit Prayer Requests</label>
        <input id="prayers" type="textarea" rows="5" cols="33">
        <button class="submitButton" type="submit" name="submitButton">Submit</button>
    </div>
    <div class="verse">
    </div>
    <h2 class="prayerResponse"></h2>
    <script src="js/main.js"></script>
</body>
</html>
